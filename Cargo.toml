[package]
name = "wasm2asm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Standalone WebAssembly to compact asm.js converter"

[dependencies]
bitflags = "2.9"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
wasmparser = { version = "0.258.0", default-features = false, features = ["std", "validate", "features", "simd"] }

[dev-dependencies]
wat = "1.258.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
